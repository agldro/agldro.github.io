<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrolling Divs</title>
<style>
    .scroll-container {
        width: 100px;
        height: 100px;
        overflow: auto;
        white-space: nowrap;
        border: 1px solid black;
    }

    .scroll-item {
        display: inline-block;
        width: 80px;
        height: 80px;
        margin: 5px;
        background-color: lightblue;
    }
</style>
</head>
<body>
<div class="scroll-container" id="scrollContainer"></div>

<script>
    const scrollContainer = document.getElementById('scrollContainer');

    // Create div elements and append to the scroll container
    for (let i = 0; i < 10; i++) {
        const div = document.createElement('div');
        div.className = 'scroll-item';
        div.textContent = `Div ${i+1}`;
        scrollContainer.appendChild(div);
    }

    let scrollPos = 0;
    const scrollSpeed = 2;// Adjust scroll speed as needed

    function callFunctionMultipleTimes(func, times) {
    let count = 0;
    let interval = setInterval(() => {
        func();
        count++;
        if (count === times) {
            clearInterval(interval);
        }
    }, 50);
}

    function scrollMoment() {
        scrollPos += scrollSpeed;
        scrollContainer.scrollLeft = scrollPos;
        if (scrollPos >= scrollContainer.scrollWidth - scrollContainer.clientWidth) {
            scrollPos = 0;
        }
    }

    function scrollDivs() {
        callFunctionMultipleTimes(scrollMoment, 90/2)
    }

    setInterval(scrollDivs, 5000);
</script>
</body>
</html>
